name: Windows Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore IrisTrackAI.sln
      - run: dotnet publish src/IrisTrackAI/IrisTrackAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: IrisTrackAI-win-x64
          path: publish/win-x64/
