name: Publicar Release de Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ejemplo: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolver versión
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.version }}'.Trim()
          } else {
            $tag = '${{ github.ref_name }}'.Trim()
          }
          if (-not $tag.StartsWith('v')) { $tag = 'v' + $tag }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restaurar dependencias
        run: dotnet restore IrisTrackAI.sln

      - name: Publicar IrisTrack AI win-x64
        run: >-
          dotnet publish src/IrisTrackAI/IrisTrackAI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Crear ZIP de distribución
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $zip = "IrisTrackAI-$tag-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zip -CompressionLevel Optimal
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Crear tag en ejecución manual
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (-not (git ls-remote --tags origin "refs/tags/$tag")) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

      - name: Crear o actualizar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $zip = $env:RELEASE_ZIP
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "IrisTrack AI $tag" --generate-notes
          }
